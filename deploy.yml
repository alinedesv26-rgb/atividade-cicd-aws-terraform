name: Terraform CI/CD - AWS

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Validar e implantar infraestrutura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_db_username: ${{ vars.TF_VAR_DB_USERNAME }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validar variáveis obrigatórias
        run: |
          test -n "$TF_STATE_BUCKET" || (echo "Configure a variável TF_STATE_BUCKET no GitHub." && exit 1)
          test -n "$AWS_REGION" || (echo "Configure a variável AWS_REGION no GitHub." && exit 1)
          test -n "$TF_VAR_db_password" || (echo "Configure o secret TF_VAR_DB_PASSWORD no GitHub." && exit 1)

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=atividade-cicd/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan | tee plan.log

      - name: Salvar log do plano como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: terraform/plan.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
